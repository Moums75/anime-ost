server {
    listen 80;
    root /usr/share/nginx/html;

    # Envoi de fichiers audio par l'admin (30 Mo max côté API)
    client_max_body_size 35m;

    # API : tout passe par le BFF (seul service joignable depuis le front)
    location /api/ {
        proxy_pass http://bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # vraie IP pour la limite de connexion
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # streaming audio (requêtes Range) sans attendre tout le fichier
        proxy_request_buffering off;  # uploads transmis au fil de l'eau
    }

    # Fichiers générés par Vite (nom avec empreinte) : cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toutes les autres URL renvoient index.html (React Router)
    location / {
        try_files $uri /index.html;
    }
}
